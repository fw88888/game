<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>终极炫酷贪吃蛇</title>
    <style>
        :root {
            --snake-gradient-1: #4CAF50;
            --snake-gradient-2: #45a049;
            --snake-gradient-3: #3d8b40;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: radial-gradient(circle, #1a1a2e, #0d0d1a);
            margin: 0;
            height: 100vh;
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            color: white;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            margin-top: 20px;
            display: none;
        }

        #gameCanvas {
            border: 3px solid #32324d;
            border-radius: 15px;
            box-shadow: 0 0 30px rgba(76, 175, 80, 0.4);
            background: rgba(25, 25, 35, 0.9);
        }

        #scoreBoard {
            font-size: 28px;
            margin: 20px 0;
            padding: 15px 30px;
            background: linear-gradient(45deg, #25253a, #1a1a2e);
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #4CAF50;
        }

        .menu {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(145deg, #25253a, #1a1a2e);
            padding: 40px 60px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 2px solid #4CAF50;
            min-width: 350px;
            z-index: 100;
        }

        .menu button {
            background: linear-gradient(45deg, #4CAF50, #45a049);
            border: none;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 25px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .menu button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.4);
        }

        #settingsMenu {
            display: none;
        }

        .difficulty-btn {
            display: block;
            width: 100%;
            margin: 10px 0;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>
    <div id="scoreBoard">分数: 0 | 最高分: <span id="highScore">0</span></div>
    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>
    </div>

    <!-- 游戏菜单 -->
    <div id="mainMenu" class="menu">
        <h1 style="font-size: 2.5em; margin-bottom: 30px;">🐍 终极贪吃蛇</h1>
        <button onclick="startGame()">开始游戏</button>
        <button onclick="showMenu('settingsMenu')">游戏设置</button>
        <button onclick="showInstructions()">游戏说明</button>
    </div>

    <!-- 设置菜单 -->
    <div id="settingsMenu" class="menu">
        <h2>⚙️ 游戏设置</h2>
        <button class="difficulty-btn" onclick="setDifficulty('easy')">简单模式</button>
        <button class="difficulty-btn" onclick="setDifficulty('normal')">普通模式</button>
        <button class="difficulty-btn" onclick="setDifficulty('hard')">困难模式</button>
        <button style="margin-top: 20px;" onclick="showMenu('mainMenu')">返回主菜单</button>
    </div>

    <script>
        const CELL_SIZE = 20;
        const CANVAS_SIZE = 600;
        const MAX_PARTICLES = 50;
        let canvas, ctx;
        let particles = [];
        let gameLoop;
        
        const COLORS = {
            food: '#f44336',
            text: '#ffffff'
        };

        let config = {
            difficulty: 'normal',
            gameSpeed: 100,
            snakeSpeedBoost: 1,
            particleEffects: true
        };

        let snake = [];
        let direction = { x: CELL_SIZE, y: 0 };
        let food = { x: 0, y: 0 };
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameOver = false;
        let paused = false;

        function initGame() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            canvas.width = CANVAS_SIZE;
            canvas.height = CANVAS_SIZE;
            
            initParticles();
            document.getElementById('highScore').textContent = highScore;
            resetGame();
            document.addEventListener('keydown', handleKeyPress);
        }

        function initParticles() {
            const particlesCanvas = document.getElementById('particles');
            particlesCanvas.width = window.innerWidth;
            particlesCanvas.height = window.innerHeight;
        }

        function createFoodParticles(x, y) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1.0
                });
            }
        }

        function updateParticles() {
            const particlesCanvas = document.getElementById('particles');
            const pctx = particlesCanvas.getContext('2d');
            pctx.clearRect(0, 0, particlesCanvas.width, particlesCanvas.height);
            
            particles = particles.filter(particle => {
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.life -= 0.03;
                
                pctx.fillStyle = `rgba(244, 67, 54, ${particle.life})`;
                pctx.beginPath();
                pctx.arc(particle.x, particle.y, 3, 0, Math.PI * 2);
                pctx.fill();
                
                return particle.life > 0;
            });
        }

        function generateFood() {
            do {
                food.x = Math.floor(Math.random() * (CANVAS_SIZE/CELL_SIZE)) * CELL_SIZE;
                food.y = Math.floor(Math.random() * (CANVAS_SIZE/CELL_SIZE)) * CELL_SIZE;
            } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
            
            if(config.particleEffects) {
                createFoodParticles(food.x + CELL_SIZE/2, food.y + CELL_SIZE/2);
            }
        }

        function drawGame() {
            const gradient = ctx.createRadialGradient(
                CANVAS_SIZE/2, CANVAS_SIZE/2, 0,
                CANVAS_SIZE/2, CANVAS_SIZE/2, CANVAS_SIZE
            );
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#0d0d1a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            ctx.strokeStyle = 'rgba(50, 50, 77, 0.3)';
            for (let i = 0; i <= CANVAS_SIZE; i += CELL_SIZE) {
                ctx.beginPath();
                ctx.moveTo(i, 0);
                ctx.lineTo(i, CANVAS_SIZE);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i);
                ctx.lineTo(CANVAS_SIZE, i);
                ctx.stroke();
            }

            ctx.save();
            ctx.shadowColor = COLORS.food;
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(food.x + CELL_SIZE/2, food.y + CELL_SIZE/2, CELL_SIZE/2, 0, Math.PI * 2);
            ctx.fillStyle = COLORS.food;
            ctx.fill();
            ctx.restore();

            snake.forEach((segment, index) => {
                const gradient = ctx.createLinearGradient(
                    segment.x, segment.y,
                    segment.x + CELL_SIZE, segment.y + CELL_SIZE
                );
                gradient.addColorStop(0, '#4CAF50');
                gradient.addColorStop(0.5, '#45a049');
                gradient.addColorStop(1, '#3d8b40');
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.roundRect(segment.x, segment.y, CELL_SIZE, CELL_SIZE, 5);
                ctx.fill();
                
                ctx.strokeStyle = 'rgba(0,0,0,0.2)';
                ctx.lineWidth = 2;
                ctx.stroke();
            });

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                ctx.fillStyle = COLORS.text;
                ctx.font = 'bold 40px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束！', CANVAS_SIZE/2, CANVAS_SIZE/2 - 20);
                ctx.font = '20px Arial';
                ctx.fillText('按 R 重玩 ｜ Q 退出', CANVAS_SIZE/2, CANVAS_SIZE/2 + 30);
            }

            if (paused) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                ctx.fillStyle = COLORS.text;
                ctx.font = '30px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('游戏暂停', CANVAS_SIZE/2, CANVAS_SIZE/2);
            }
        }

        function updateGame() {
            if (gameOver || paused) return;

            const head = { 
                x: snake[0].x + direction.x,
                y: snake[0].y + direction.y
            };

            if (head.x < 0 || head.x >= CANVAS_SIZE || 
                head.y < 0 || head.y >= CANVAS_SIZE ||
                snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver = true;
                if(score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    document.getElementById('highScore').textContent = highScore;
                }
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                document.getElementById('scoreBoard').textContent = `分数: ${score} | 最高分: ${highScore}`;
                generateFood();
            } else {
                snake.pop();
            }
        }

        function handleKeyPress(e) {
            if (gameOver && e.key.toLowerCase() === 'q') {
                showMenu('mainMenu');
                return;
            }

            switch(e.key) {
                case 'ArrowUp':
                    if (direction.y === 0) direction = { x: 0, y: -CELL_SIZE };
                    break;
                case 'ArrowDown':
                    if (direction.y === 0) direction = { x: 0, y: CELL_SIZE };
                    break;
                case 'ArrowLeft':
                    if (direction.x === 0) direction = { x: -CELL_SIZE, y: 0 };
                    break;
                case 'ArrowRight':
                    if (direction.x === 0) direction = { x: CELL_SIZE, y: 0 };
                    break;
                case 'p':
                case 'P':
                    paused = !paused;
                    break;
                case 'r':
                case 'R':
                    if (gameOver) resetGame();
                    break;
            }
        }

        function showMenu(menuId) {
            document.querySelectorAll('.menu').forEach(m => m.style.display = 'none');
            if(menuId) {
                document.getElementById(menuId).style.display = 'block';
                document.getElementById('gameContainer').style.display = 'none';
            } else {
                document.getElementById('gameContainer').style.display = 'block';
            }
        }

        function startGame() {
            showMenu(null);
            resetGame();
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(() => {
                updateGame();
                drawGame();
                if(config.particleEffects) updateParticles();
            }, config.gameSpeed);
        }

        function setDifficulty(level) {
            const speeds = { easy: 150, normal: 100, hard: 70 };
            config.difficulty = level;
            config.gameSpeed = speeds[level];
            if(gameLoop) {
                clearInterval(gameLoop);
                gameLoop = setInterval(() => {
                    updateGame();
                    drawGame();
                    if(config.particleEffects) updateParticles();
                }, config.gameSpeed);
            }
        }

        function showInstructions() {
            alert("游戏说明：\n1. 方向键控制移动\n2. 吃红色食物得分\n3. 避免撞墙和自碰\n4. P键暂停/继续\n5. R键重玩\n6. Q键返回主菜单");
        }

        function resetGame() {
            snake = [
                { x: 300, y: 300 },
                { x: 280, y: 300 },
                { x: 260, y: 300 }
            ];
            direction = { x: CELL_SIZE, y: 0 };
            score = 0;
            gameOver = false;
            paused = false;
            document.getElementById('scoreBoard').textContent = `分数: 0 | 最高分: ${highScore}`;
            generateFood();
        }

        window.onload = initGame;
    </script>
</body>
</html>
